# TryDesk coturn (TURN relay) configuration — TEMPLATE.
# setup.sh regenerates this file on deploy, injecting the real static-auth-secret
# from .env and the server's detected public IP. Edit setup.sh, not this copy,
# for permanent changes. Port 8443 is used because 3478 is often blocked by ISPs.
listening-port=8443
listening-ip=YOUR_SERVER_PUBLIC_IP
relay-ip=YOUR_SERVER_PUBLIC_IP
external-ip=YOUR_SERVER_PUBLIC_IP
realm=turn.example.com
server-name=turn.example.com
use-auth-secret
static-auth-secret=REPLACED_BY_SETUP_SH
fingerprint
min-port=49160
max-port=49260
no-tls
no-dtls
no-cli
no-multicast-peers
no-tcp-relay
total-quota=100
user-quota=12
stale-nonce=600
# Never relay into private / local networks (protects the VPS's own network)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
